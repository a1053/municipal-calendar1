name: Actualizar calendarios

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "data/overrides.csv"
      - "data/matches.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-calendarios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar la Liga, aplicar correcciones y generar .ics
        id: update
        continue-on-error: true
        run: python -m calbot update

      - name: Guardar cambios
        run: |
          git config user.name "calendarios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar calendarios"
            git pull --rebase
            git push
          fi

      - name: Avisar si algo falló
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::La actualización falló. Revisa el paso anterior."
          exit 1
